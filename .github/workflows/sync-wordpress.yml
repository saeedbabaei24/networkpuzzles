
name: Sync WordPress Blog

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: wordpress-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install markdownify==0.14.1

      - name: Sync WordPress posts
        run: python scripts/sync_wordpress.py

      - name: Commit and push changes
        run: |
          git config user.name "saeedbabaei24"
          git config user.email "39956328+saeedbabaei24@users.noreply.github.com"
          git add blog/
          if ! git diff --cached --quiet; then
            git commit -m "Sync WordPress blog posts"
            git push
          else
            echo "No changes detected"
          fi
